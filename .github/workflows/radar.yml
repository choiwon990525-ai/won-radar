name: WON 레이더 수집

on:
  schedule:
    - cron: "17 */3 * * *"   # 예약은 3시간마다(UTC :17 → KST :17) — GitHub가 늦추거나 건너뛰어서 실제로는 하루 2~4번
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "scripts/radar/**"
      - "tests/**"
      - "peekers-advantage.html"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 단위 시험 (인터넷 없이 — 가짜 유튜브 응답만)
        run: python3 -m unittest discover -s tests -t .

      # 못 읽으면 멈춤: 빈 것으로 시작하면 14일 소식 · 꿀팁 코드와 주 번호가 사라져서. 다음 예약 때 다시 해 봄.
      - name: 지난 데이터 가져오기 (gh-pages)
        run: |
          mkdir -p _prev
          git fetch --depth=1 origin gh-pages
          for f in data.json refcheck.json tips.json; do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              git show "FETCH_HEAD:$f" > "_prev/$f"
              python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "_prev/$f"
            else
              echo '{}' > "_prev/$f"
              echo "::notice::gh-pages 에 $f 가 없어서 빈 것에서 시작"
            fi
          done

      - name: 브리핑용 SDK (키가 있을 때만)
        if: env.ANTHROPIC_API_KEY != ''
        run: python3 -m pip install --quiet "anthropic==2.6.0"

      - name: 소식 수집
        run: python3 scripts/radar/collect.py --sources scripts/radar/sources.json --prev _prev/data.json --out _site/data.json

      # 유튜브 키 · 뺄 채널 · 소속 낱말은 이 단계에만 넘김. 공개 파일(tips.json)에는 안 남음.
      - name: 꿀팁 수집 (유튜브 공식 API)
        id: tips
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RADAR_SKIP_CHANNELS: ${{ secrets.RADAR_SKIP_CHANNELS }}
          RADAR_BLOCK_WORDS: ${{ secrets.RADAR_BLOCK_WORDS }}
          EVENT: ${{ github.event_name }}
        run: >
          python3 scripts/radar/tips.py --config scripts/radar/tips_sources.json
          --prev _prev/tips.json --out _site/tips.json --week-out _site/tips_week.json --event "$EVENT"

      # 꿀팁 수집이 고장 나도 소식은 그대로 배포 — 지난 꿀팁 파일을 그대로 둠 (29일 지나면 앱이 스스로 숨김)
      - name: 꿀팁 수집이 실패하면 지난 파일 유지
        if: steps.tips.outcome == 'failure'
        run: |
          echo "::warning::꿀팁 수집이 실패해서 지난 tips.json 을 그대로 둠"
          cp _prev/tips.json _site/tips.json
          git show FETCH_HEAD:tips_week.json > _site/tips_week.json 2>/dev/null || echo '{}' > _site/tips_week.json

      - name: 레퍼런스 링크 점검 (같은 링크는 7일에 한 번 · robots.txt 지킴 · 유튜브는 안 봄)
        run: >
          python3 scripts/radar/check_refs.py
          --inputs scripts/radar/ref_candidates.json radar/references.json
          --prev _prev/refcheck.json --out _site/refcheck.json

      - name: 공개 전 확인 (레퍼런스에 용도·반 칸이나 반 이름이 있으면 멈춤)
        env:
          RADAR_HIDE_WORDS: ${{ secrets.RADAR_HIDE_WORDS }}
        run: >
          python3 scripts/radar/build_refs.py --check
          radar/references.json scripts/radar/notion_refs_export.json scripts/radar/ref_candidates.json

      - name: 사이트 만들기
        run: |
          cp -r radar/. _site/
          mkdir -p _site/peek && cp peekers-advantage.html _site/peek/index.html   # 피커스 어드밴티지 → /peek/
          touch _site/.nojekyll

      - name: 공개 전 확인 (열쇠 모양 글자가 있으면 멈춤)
        run: |
          if grep -rIlE 'AIza[0-9A-Za-z_-]{35}|sk-ant-[0-9A-Za-z_-]{20,}' _site; then
            echo "::error::배포 파일에 API 키 모양 글자가 있어서 멈춤"; exit 1
          fi

      - name: gh-pages로 배포 (main 에서만)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "radar: $(date -u +%Y-%m-%dT%H:%MZ) 수집"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
